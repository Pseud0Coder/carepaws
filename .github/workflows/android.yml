name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Write build-time config
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: env | grep '^NEXT_PUBLIC_' > .env.production.local

      - name: Write google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GSJ" | base64 -d > android/app/google-services.json

      - name: Build web bundle and sync Android project
        run: npm run android:sync

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.CAREPAWS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble APKs
        working-directory: android
        env:
          CAREPAWS_KEYSTORE: ${{ secrets.CAREPAWS_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          CAREPAWS_KEYSTORE_PASSWORD: ${{ secrets.CAREPAWS_KEYSTORE_PASSWORD }}
          CAREPAWS_KEY_ALIAS: ${{ secrets.CAREPAWS_KEY_ALIAS }}
          CAREPAWS_KEY_PASSWORD: ${{ secrets.CAREPAWS_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug
          if [ -n "$CAREPAWS_KEYSTORE" ]; then ./gradlew assembleRelease; fi

      - uses: actions/upload-artifact@v4
        with:
          name: carepaws-apk
          path: android/app/build/outputs/apk/**/*.apk
