name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Cloud Functions build
        working-directory: functions
        run: npm ci && npx tsc -p .

      # The security rules are the app's authorization layer, so they are tested on every push.
      - name: Security rules (Firestore + Storage emulators)
        run: npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-carepaws "node --test tests/"
